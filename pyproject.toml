[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AlienAPI"
version = "0.1.0"
description = "pip install AlienAPI — Irene from the 2018 Sentdex stream lives in your terminal. Pre-GPT chatbot nostalgia with coherent, contextual replies."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WhoIsAbishag (GABAyou)", email = "your-email@example.com"}  # ← change to your email if you want
]
keywords = ["chatbot", "irene", "cleverbot", "sentdex", "pre-gpt", "nostalgia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GABAyou/AlienAPI"
Documentation = "https://github.com/GABAyou/AlienAPI#readme"
"Bug Tracker" = "https://github.com/GABAyou/AlienAPI/issues"

[tool.setuptools.packages.find]
where = ["src"]



